version: 2

models:
  - name: fct_station_demand_vs_supply
    description: "Perbandingan kondisi ketersediaan sepeda saat ini dengan rata-rata pola trip historis di jam & hari yang sama"
    columns:
      - name: station_id
        tests:
          - not_null

      - name: supply_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'empty'
                  - 'full'
                  - 'no_historical_data'
                  - 'normal'